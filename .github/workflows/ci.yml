name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        # Poseidon2Yul_BN254 compiles above EIP-170 under these settings; deployments use
        # its canonical address instead, so the size check is not applied here.
        run: forge build --skip test
      - name: Unit, fuzz and invariant tests
        run: forge test -vv
        env:
          FOUNDRY_PROFILE: ci
      - name: Symbolic proofs
        run: |
          python3 -m pip install --quiet halmos
          halmos --contract SymbolicTest --solver-timeout-assertion 0

  circuit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits/shielded_spend
    steps:
      - uses: actions/checkout@v4
      - uses: noir-lang/noirup@v0.1.3
        with:
          toolchain: 1.0.0-beta.22
      - name: Circuit tests
        run: nargo test

  device:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
        working-directory: tools
      - run: pnpm install --frozen-lockfile
      - name: Gateway and provisioning tests
        run: node --test gateway/test/*.test.ts
      - name: Firmware host tests (encoding, Merkle, digests, keys)
        run: |
          python3 -m pip install --quiet platformio
          cd firmware && pio test -e native

  model:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Model tests
        run: python -m pytest -q
