; Kütle battery-side device firmware.
;
;   pio run -e esp32-s3-devkitc-1        host-fed build (gateway sends readings)
;   pio run -e esp32-s3-devkitc-1-smbus  reads a TI bq gauge over SMBus
;   pio test -e native                   checks ../test-vectors.json on this computer
;
; lib/mldsa-native and lib/secp256k1 are git submodules. They are compiled
; through the lib/mldsa_port and lib/secp256k1_port manifests, so the raw
; submodule folders are ignored as libraries.

[platformio]
default_envs = esp32-s3-devkitc-1

[common]
build_flags =
    -DMLD_CONFIG_FILE='"kutle_mldsa_config.h"'
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/lib/mldsa-native/mldsa
    -I${PROJECT_DIR}/lib/secp256k1/include
lib_ignore = mldsa-native, secp256k1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    ${common.build_flags}
    -DKUTLE_MLDSA_REDUCE_RAM
    -DKUTLE_MODE_SMBUS=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_ignore = ${common.lib_ignore}
test_ignore = *

[env:esp32-s3-devkitc-1-smbus]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -DKUTLE_MLDSA_REDUCE_RAM
    -DKUTLE_MODE_SMBUS=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
build_flags =
    ${common.build_flags}
    -DKUTLE_VECTORS_PATH='"${PROJECT_DIR}/../test-vectors.json"'
lib_ignore = ${common.lib_ignore}
test_build_src = no
